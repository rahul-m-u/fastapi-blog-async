{% extends "base.html" %}
{% block content %}
<div class="content-section py-3 px-4 mb-4">
    <h2 class="mb-4">Login</h2>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control"
                   id="password"
                   name="password"
                   required
                   type="password">
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="mt-3">
        Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a>
    </p>
</div>
{% endblock content %}
{% block scripts %}
<script type="module">
    import {getErrorMessage, showModal} from '/static/js/utils.js';

    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(loginForm);

        try {
            // OAuth2PasswordRequestForm expects form data, not JSON
            const response = await fetch('/api/users/token', {
                method: 'POST',
                body: formData,
            });

            if (response.ok) {
                const data = await response.json();

                // Store token in localStorage
                localStorage.setItem('access_token', data.access_token);

                // Show success modal and redirect to home
                document.getElementById('successMessage').textContent =
                    'Login successful!';
                showModal('successModal');

                document.getElementById('successModal').addEventListener('hidden.bs.modal', () => {
                    window.location.href = '/';
                }, {once: true});
            } else {
                const error = await response.json();
                document.getElementById('errorMessage').textContent = getErrorMessage(error);
                showModal('errorModal');
            }
        } catch (error) {
            document.getElementById('errorMessage').textContent =
                'Network error. Please check your connection and try again.';
            showModal('errorModal');
        }
    });
</script>
{% endblock scripts %}
