{% extends "base.html" %}
{% block content %}
<article class="content-section py-3 px-4 mb-4">
	<div class="d-flex align-items-start gap-4">
		<img alt="{{ post.author.username }}'s profile picture"
		     class="rounded-circle article-img flex-shrink-0"
		     height="64"
		     loading="lazy"
		     src="{{ post.author.image_path }}"
		     width="64">
		<div class="flex-grow-1">
			<div class="article-metadata mb-2">
				<a class="me-2" href="{{ url_for('user_posts', user_id=post.author.id) }}">{{ post.author.name }}</a>
				<small class="text-body-secondary">{{ post.date_posted.strftime("%B %d, %Y") }}</small>
			</div>
			<h2 class="article-title">{{ post.title }}</h2>
			<p class="article-content">{{ post.content }}</p>
			<!-- Only show edit/delete options if the user is the author -->
			<!-- TODO: Add user authentication and authorization -->
			<div class="post-actions mt-3 pt-3 border-top">
				<a class="btn btn-outline-secondary me-1" href="#">Edit Post</a>
				<button class="btn btn-outline-danger"
				        data-bs-target="#deleteModal"
				        data-bs-toggle="modal"
				        type="button">Delete Post
				</button>
			</div>
			<!-- TODO: Add user authentication and authorization -->
		</div>
	</div>
</article>

<!-- Delete Confirmation Modal -->
<div aria-hidden="true"
     aria-labelledby="deleteModalLabel"
     class="modal fade"
     id="deleteModal"
     tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
				<button aria-label="Close"
				        class="btn-close"
				        data-bs-dismiss="modal"
				        type="button"></button>
			</div>
			<!-- TODO: <form action="#" method="post"> -->
			<form action="#">
				<div class="modal-body">Are you sure you want to delete this post? This action cannot be undone.</div>
				<div class="modal-footer">
					<button class="btn btn-outline-secondary"
					        data-bs-dismiss="modal"
					        type="button">Cancel
					</button>
					<button class="btn btn-outline-danger" type="submit">Delete</button>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock content %}
